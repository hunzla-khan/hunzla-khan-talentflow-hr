<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentFlow – HR Recruitment CRM</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4fb;--side:#161a3a;--card:#fff;--tx:#1b1f3b;--mu:#6c7293;--bd:#e4e7f4;--pr:#6366f1;--pr2:#a855f7;--prt:#fff;--ok:#10a37f;--bad:#e5484d;--warn:#e59a1a;--sh:0 6px 24px rgba(40,45,110,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1020;--side:#0a0c1a;--card:#171a31;--tx:#eef0fb;--mu:#9a9fc0;--bd:#262a48;--sh:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1020;--side:#0a0c1a;--card:#171a31;--tx:#eef0fb;--mu:#9a9fc0;--bd:#262a48;--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.shell{display:flex;min-height:100%}
aside{width:228px;background:var(--side);color:#cfd3f5;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff;font-weight:700;font-size:19px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pr),var(--pr2));display:grid;place-items:center;font-style:normal}
aside button{display:flex;gap:10px;align-items:center;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;text-align:left}
aside button:hover{background:rgba(255,255,255,.07)}aside button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.4)}
.me{margin-top:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13px}
.me b{display:block;color:#fff}.me span{opacity:.7}
main{flex:1;min-width:0;padding:24px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:24px}h2{margin:0 0 10px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.hero{background:linear-gradient(135deg,#4f46e5,#9333ea 60%,#ec4899);color:#fff;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
.hero h1{color:#fff}.hero p{margin:6px 0 0;opacity:.9}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.stat{display:flex;gap:12px;align-items:center}.stat em{font-style:normal;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.18))}
.stat b{font-size:26px;display:block;line-height:1.1}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);border-color:transparent}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn.s{background:none;color:var(--tx);border:1px solid var(--bd);font-weight:500;padding:6px 11px;font-size:13px}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad);color:#fff;border:0}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-size:12px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.who{display:flex;gap:10px;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(99,102,241,.14);color:var(--pr)}
.p-Selected{background:rgba(16,163,127,.15);color:var(--ok)}.p-Rejected{background:rgba(229,72,77,.14);color:var(--bad)}.p-Shortlisted,.p-Interview{background:rgba(229,154,26,.16);color:var(--warn)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:9px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.col{min-width:240px;flex:1;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.col h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.k{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}.k:hover{border-color:var(--pr)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pr) calc(var(--v)*1%),var(--bd) 0)}
.ring b{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.6);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--card);border-radius:18px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto}
.note{padding:10px 12px;border-radius:10px;background:rgba(16,163,127,.12);color:var(--ok);margin-bottom:12px}
.chip{display:inline-block;margin:2px;padding:1px 8px;border-radius:8px;font-size:12px;border:1px solid var(--bd)}
.pub{max-width:660px;margin:0 auto}
@media(max-width:760px){.shell{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.logo,.me{display:none}aside button{white-space:nowrap}main{padding:16px}}
</style>
<style>
.pub{max-width:660px;margin:0 auto}.login{max-width:390px;margin:10vh auto}.err{color:var(--bad);margin-top:8px}.p-Hired{background:rgba(16,163,127,.2);color:var(--ok)}aside{overflow-y:auto}.act{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}.act:hover{border-color:var(--pr)}.act b.n{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:99px;padding:1px 10px;font-size:13px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.step:last-child{border:0}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
</style>
</head><body>
<div class="shell"><aside id="side" style="display:none"></aside><main id="app"><div class="card">Loading TalentFlow…</div></main></div>
<div id="modal"></div>
<script>
const STAGES=["Applied","Screened","Shortlisted","Interview","Selected","Hired","Rejected"];
const IMP=["LinkedIn","Indeed","Rozee.pk","Campaign form","Other"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=n=>String(n||"?").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
const hue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 60% 50%)`};
const av=n=>`<span class="av" style="background:${hue(n)}">${esc(ini(n))}</span>`;
let D={jobs:[],apps:[],users:[],interviews:[],offers:[],company:"",th:60},ME=null,tab="Dashboard",flt={job:"",q:"",src:"",stage:""},note="";
const job=id=>D.jobs.find(j=>j.id==id)||{title:"(removed job)",dept:"",keywords:[],minExp:0};
const isHR=()=>ME&&ME.role!="manager";
const ROLE={admin:"HR Admin",hr:"HR Staff",manager:"Hiring Manager"};
const ICON={Dashboard:"📊",Pipeline:"🗂️",Candidates:"👥",Jobs:"💼","ATS Screening":"🤖",Interviews:"📅",Offers:"📄",Reports:"📈",Import:"📥",Users:"🔐"};
async function api(m,u,b){const r=await fetch("/api"+u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined,credentials:"same-origin"});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||"Request failed");e.status=r.status;throw e}return j}
async function refresh(){const d=await api("GET","/data");D=d;ME=d.user;render()}
async function run(f){try{await f();await refresh()}catch(e){if(e.status==401){ME=null;renderLogin()}else alert(e.message)}}
const tabs=()=>{const hr=isHR(),t=["Dashboard"];if(hr)t.push("Jobs");t.push("Candidates","Pipeline");if(hr)t.push("ATS Screening");t.push("Interviews");if(hr)t.push("Offers");t.push("Reports");if(hr)t.push("Import");if(ME.role=="admin")t.push("Users");return t};
const closeM=()=>$("modal").innerHTML="";
const pill=s=>`<span class="pill p-${s}">${s}</span>`;
const bar=v=>v==null?'<span class="mu">Not screened</span>':`<div class="bar" style="min-width:70px"><i style="width:${v}%"></i></div><span class="mu">${v}%</span>`;
const N=()=>note?`<div class="note">${esc(note)}</div>`:"";

/* ---------- public apply page (no login) ---------- */
const PM=location.pathname.match(/^\/apply\/(\w+)/);
async function renderPub(){document.title="Apply – TalentFlow";let j;try{j=await api("GET","/public/job/"+PM[1])}catch(e){}
 const box=h=>$("app").innerHTML=`<div class="pub">${h}</div>`;
 if(!j||j.status!="Open")return box('<div class="card"><h1>Position unavailable</h1><p class="mu">This job is closed or the link is incorrect.</p></div>');
 box(`<div class="hero"><h1>${esc(j.title)}</h1><p>${j.company?esc(j.company)+" · ":""}${esc(j.dept)}${j.sector?" · "+esc(j.sector):""}</p></div><div class="card"><p class="mu">Experience required: ${j.minExp} yr${j.keywords.length?" · Key skills: "+esc(j.keywords.join(", ")):""}</p><div class="row"><div><label>Full name</label><input id="an"></div><div><label>Email</label><input id="ae" type="email"></div><div><label>Phone</label><input id="ap"></div><div><label>Years of experience</label><input id="ax" type="number" min="0"></div></div><input id="aw" style="display:none" tabindex="-1" autocomplete="off"><label>Your skills &amp; experience (paste your CV text)</label><textarea id="at"></textarea><p><button class="btn" id="sb" onclick="submitPub('${j.id}')">Submit application</button></p><div class="err" id="pe"></div></div>`)}
async function submitPub(id){const g=i=>$(i).value.trim();$("pe").textContent="";$("sb").disabled=true;
 try{await api("POST","/public/apply",{jobId:id,name:g("an"),email:g("ae"),phone:g("ap"),exp:g("ax"),text:g("at"),website:$("aw").value,source:new URLSearchParams(location.search).get("src")||"link"});
  $("app").innerHTML='<div class="pub"><div class="hero"><h1>Application received 🎉</h1><p>Thank you! Our HR team will review your profile and contact you.</p></div></div>'}catch(e){$("pe").textContent=e.message;$("sb").disabled=false}}

/* ---------- login ---------- */
function renderLogin(){$("side").style.display="none";closeM();$("app").innerHTML=`<div class="login card"><div class="logo" style="color:var(--tx);padding:0 0 14px"><i>✦</i>TalentFlow</div><h2>Sign in to HR CRM</h2><label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><p><button class="btn" style="width:100%" onclick="doLogin()">Sign in</button></p><div class="err" id="le"></div></div>`}
async function doLogin(){try{await api("POST","/login",{username:$("lu").value,password:$("lp").value});tab="Dashboard";await refresh()}catch(e){$("le").textContent=e.message}}
async function logout(){await api("POST","/logout");ME=null;renderLogin()}
async function chPw(){const o=prompt("Current password:");if(o==null)return;const n=prompt("New password (min 6 characters):");if(n==null)return;try{await api("POST","/password",{old:o,new:n});alert("Password changed.")}catch(e){alert(e.message)}}

/* ---------- actions ---------- */
const stage=(id,st)=>run(()=>api("PATCH","/apps/"+id,{stage:st}));
const saveNote=id=>run(async()=>{await api("PATCH","/apps/"+id,{notes:$("nt").value});closeM()});
const delApp=id=>{if(confirm("Delete this candidate permanently?"))run(async()=>{await api("DELETE","/apps/"+id);closeM()})};
const runATS=()=>run(async()=>{const r=await api("POST","/ats/run");note=r.count?`ATS screened ${r.count} application(s).`:"No new applications to screen."});
const setTH=v=>run(()=>api("PUT","/settings",{th:+v}));
const addJob=()=>{const g=i=>$(i).value.trim();run(async()=>{await api("POST","/jobs",{title:g("jt"),dept:g("jd"),sector:g("js"),minExp:g("jx"),keywords:g("jk").split(",")});note="Job posted."})};
const toggleJob=id=>run(()=>api("PATCH","/jobs/"+id,{status:job(id).status=="Open"?"Closed":"Open"}));
const delJob=id=>{if(confirm("Delete this job? Its candidates stay in the system."))run(()=>api("DELETE","/jobs/"+id))};
const addUser=()=>{const g=i=>$(i).value.trim();run(async()=>{await api("POST","/users",{name:g("un"),username:g("uu"),password:$("up").value,role:$("ur").value});note="User created. Share the username and password with them."})};
const setRole=(id,r)=>run(()=>api("PATCH","/users/"+id,{role:r}));
const resetPw=id=>{const p=prompt("New password for this user (min 6 characters):");if(p)run(async()=>{await api("PATCH","/users/"+id,{password:p});note="Password updated."})};
const delUser=id=>{if(confirm("Remove this user?"))run(()=>api("DELETE","/users/"+id))};
function cp(b){const i=b.previousElementSibling;i.select();try{navigator.clipboard.writeText(i.value)}catch(e){try{document.execCommand("copy")}catch(_){}}b.textContent="Copied ✓"}
function links(id){const j=job(id),B=location.origin+"/apply/"+id,L=[["Direct link",""],["LinkedIn","?src=linkedin"],["Indeed","?src=indeed"],["Rozee.pk","?src=rozee"],["Social media / WhatsApp","?src=social"]];
 $("modal").innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="mbox"><h2>Apply links · ${esc(j.title)}</h2><p class="mu">Anyone can open these links without an account. Use the matching link on each platform so you can see where applicants come from.</p>${L.map(x=>`<label>${x[0]}</label><div class="row" style="gap:6px;flex-wrap:nowrap"><input readonly value="${B+x[1]}"><button class="btn s" style="flex:0 0 auto;min-width:0" onclick="cp(this)">Copy</button></div>`).join("")}<p><a class="btn s" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Apply for "+j.title+": "+B)}">Share on WhatsApp</a> <button class="btn s" onclick="closeM()">Close</button></p></div></div>`}
function csvParse(t){const l=t.split(/\r?\n/)[0],d=(l.match(/\t/g)||[]).length>(l.match(/,/g)||[]).length?"\t":(l.includes(";")&&!l.includes(","))?";":",";const R=[];let r=[],c="",q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==d){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}
function readF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("csvt").value=r.result};r.readAsText(f)}
function doImport(){const t=$("csvt").value.trim(),jid=$("ij").value,src=$("is").value;if(!t||!jid){alert("Choose a job, then upload or paste a CSV.");return}
 const R=csvParse(t);if(R.length<2){alert("The CSV needs a header row and at least one candidate.");return}
 const H=R[0].map(h=>h.trim().toLowerCase()),iN=H.findIndex(h=>["name","full name","candidate name","applicant name","applicant"].includes(h)),iF=H.indexOf("first name"),iL=H.indexOf("last name"),iE=H.findIndex(h=>/e-?mail/.test(h)),iP=H.findIndex(h=>/phone|mobile|contact/.test(h)),iX=H.findIndex(h=>/experience|exp/.test(h));
 const rows=R.slice(1).map(r=>({name:(iN>=0?r[iN]:((r[iF]||"")+" "+(r[iL]||""))).trim(),email:(r[iE]||"").trim(),phone:(r[iP]||"").trim(),exp:parseFloat(r[iX])||0,text:r.filter((v,i)=>![iN,iF,iL,iE,iP,iX].includes(i)).join(". ")}));
 run(async()=>{const r=await api("POST","/apps/import",{jobId:jid,source:src,rows});note=`Imported ${r.ok} candidate(s) from ${src}. Skipped ${r.dup} duplicate(s) and ${r.bad} row(s) without a valid name or email.`})}
function exportCsv(){const r=[["Name","Email","Phone","Source","Job","Department","Experience","ATS","Stage"]].concat(D.apps.map(a=>[a.name,a.email,a.phone,a.source||"",job(a.jobId).title,job(a.jobId).dept,a.exp,a.score??"",a.stage]));
 const d=r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),l=document.createElement("a");l.href=URL.createObjectURL(new Blob([d],{type:"text/csv"}));l.download="candidates.csv";l.click()}

/* ---------- views ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=iso=>{const d=new Date(iso);return isNaN(d)?esc(iso):d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" · "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
const appOf=id=>D.apps.find(a=>a.id==id)||{id:"",name:"(deleted)",jobId:""};
const ivOf=id=>D.interviews.filter(i=>i.appId==id).sort((a,b)=>a.when.localeCompare(b.when));
const offOf=id=>D.offers.find(o=>o.appId==id&&o.status!="Declined")||D.offers.find(o=>o.appId==id);
const modal=h=>$("modal").innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="mbox">${h}</div></div>`;
function mail(id,kind){const a=appOf(id),j=job(a.jobId),co=D.company||"our company",sg=`\n\nBest regards,\n${ME.name}\n${co}`;
 const T={invite:[`Interview invitation – ${j.title}`,`Dear ${a.name},\n\nThank you for applying for the ${j.title} position at ${co}. We would like to invite you for an interview. Please reply with your availability.${sg}`],
 thanks:[`Your application – ${j.title}`,`Dear ${a.name},\n\nThank you for applying for the ${j.title} position at ${co}. We have received your application and will contact you soon.${sg}`],
 reject:[`Update on your application – ${j.title}`,`Dear ${a.name},\n\nThank you for your interest in the ${j.title} position at ${co} and for the time you invested. After careful consideration we will not be moving forward at this time. We wish you every success.${sg}`]};
 location.href="mailto:"+a.email+"?subject="+encodeURIComponent(T[kind][0])+"&body="+encodeURIComponent(T[kind][1])}
function openCand(id){const a=D.apps.find(x=>x.id==id);if(!a)return;const j=job(a.jobId),ivs=ivOf(a.id),of=offOf(a.id),rated=ivs.filter(i=>i.rating),avg=rated.length?(rated.reduce((t,i)=>t+i.rating,0)/rated.length).toFixed(1):null;
 const b=(s,t,c="")=>`<button class="btn s ${c}" onclick="stage('${a.id}','${s}');closeM()">${t}</button>`,st=a.stage;
 modal(`<div class="row" style="align-items:center"><div class="who">${av(a.name)}<div><h2 style="margin:0">${esc(a.name)}</h2><span class="mu">${esc(j.title)} · ${esc(j.dept)}</span></div></div>${a.score!=null?`<div style="flex:0"><div class="ring" style="--v:${a.score}"><b>${a.score}</b></div></div>`:""}</div>
 <p class="mu">${esc(a.email)} · ${esc(a.phone)} · ${a.exp} yr experience · applied ${esc(a.date)} · via ${esc(a.source||"Direct")}</p>${pill(st)}${avg?` <span class="pill">⭐ ${avg}/5 avg interview</span>`:""}
 ${a.kw!=null?`<label>ATS breakdown</label><div class="mu">Keyword match ${a.kw}% (70% weight) · Experience fit ${a.ex}% (30% weight)</div>`:""}
 <label>Profile</label><div>${esc(a.text)||"—"}</div>${(a.matched||[]).length?`<label>Matched keywords</label>${a.matched.map(k=>`<span class="chip">${esc(k)}</span>`).join("")}`:""}
 <label>Interviews</label>${ivs.map(i=>`<div class="card" style="padding:10px;margin:6px 0"><b>${fmtD(i.when)}</b> · ${esc(i.type)} · ${esc(i.interviewer)} <span class="pill">${i.status}</span>${i.rating?`<div>⭐ ${i.rating}/5 · ${esc(i.rec)}</div>`:""}${i.feedback?`<div class="mu">${esc(i.feedback)}</div>`:""}${i.status=="Scheduled"?`<div style="margin-top:6px"><button class="btn s" onclick="fb('${i.id}')">Add feedback</button></div>`:""}</div>`).join("")||'<div class="mu">No interviews yet.</div>'}
 ${["Screened","Shortlisted","Interview"].includes(st)?`<p><button class="btn s" onclick="sched('${a.id}')">📅 Schedule interview</button></p>`:""}
 ${of?`<label>Offer</label><div>${esc(of.salary||"—")} · start ${esc(of.startDate||"TBC")} <span class="pill">${of.status}</span></div>`:(isHR()&&st=="Selected"?`<p><button class="btn s" onclick="offerM('${a.id}')">📄 Create offer</button></p>`:"")}
